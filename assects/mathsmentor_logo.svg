<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d36a"/>
      <stop offset="0.5" stop-color="#c99524"/>
      <stop offset="1" stop-color="#ffe39a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193d2a"/>
      <stop offset="1" stop-color="#0b2116"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Circular badge -->
  <circle cx="64" cy="64" r="60" fill="#10251a"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="20" y="31" width="88" height="59" rx="7" fill="#f7f7f4" stroke="#d2a43a" stroke-width="2"/>
    <rect x="25" y="36" width="78" height="45" rx="3" fill="url(#screen)"/>
    <rect x="57" y="84" width="14" height="3" rx="1.5" fill="#d2a43a"/>
    <path d="M53 90h22l4 8H49z" fill="#f7f7f4"/>
    <path d="M43 99h42v4H43z" rx="2" fill="url(#gold)"/>
  </g>

  <!-- Open book -->
  <g filter="url(#shadow)">
    <path d="M31 43 Q46 36 63 46 Q80 36 97 43 L97 73 Q80 68 63 78 Q48 68 31 73Z"
          fill="#fff" stroke="url(#gold)" stroke-width="2"/>
    <path d="M63 46v32" stroke="#d2a43a" stroke-width="2"/>
    <!-- left page -->
    <text x="38" y="55" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#123d2a">Σ</text>
    <text x="49" y="55" font-family="Arial,sans-serif" font-size="7" fill="#123d2a">+</text>
    <text x="38" y="67" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#123d2a">π</text>
    <!-- right page -->
    <text x="68" y="55" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#123d2a">f(x)</text>
    <text x="68" y="67" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#123d2a">√x</text>
  </g>

  <!-- Small graduation cap -->
  <path d="M49 35l15-7 15 7-15 7z" fill="url(#gold)" stroke="#a87819" stroke-width="1"/>
  <path d="M56 36v5q8 5 16 0v-5" fill="#d5a52e"/>
  <path d="M79 34v8" stroke="#f4d36e" stroke-width="1.5"/>
  <circle cx="79" cy="43" r="2" fill="#f4d36e"/>
</svg>